name: DTest-Style Game Engine CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Native C++ Engine
        run: |
          msbuild CrashHandler.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Compile C# Automation Tool
        run: |
          dotnet build AutomationTool/AutomationTool.csproj -c Release

      - name: Execute Automated Headless Integration Test
        shell: powershell
        run: |
          # 1. Dynamically locate the built CrashHandler.exe and AutomationTool.exe
          $engineItem = Get-ChildItem -Path . -Recurse -Filter "CrashHandler.exe" | Where-Object { $_.FullName -like "*Release*" } | Select-Object -First 1
          $toolItem = Get-ChildItem -Path . -Recurse -Filter "AutomationTool.exe" | Where-Object { $_.FullName -like "*Release*" } | Select-Object -First 1

          if (-not $engineItem) {
              Write-Error "Could not locate compiled CrashHandler.exe in Release folder!"
              exit 1
          }

          if (-not $toolItem) {
              Write-Error "Could not locate compiled AutomationTool.exe in Release folder!"
              exit 1
          }

          $enginePath = $engineItem.FullName
          $toolPath = $toolItem.FullName

          Write-Host "Located Engine Executable: $enginePath"
          Write-Host "Located Test Runner Executable: $toolPath"

          # 2. Launch C++ Engine in background and wait for IPC pipe initialization
          $engineProcess = Start-Process -FilePath $enginePath -PassThru
          Start-Sleep -Seconds 3

          # 3. Launch C# Test Runner and wait for execution to complete
          $toolProcess = Start-Process -FilePath $toolPath -Wait -PassThru

          # 4. Check test runner exit code (0 = all pass, 1 = failure)
          if ($toolProcess.ExitCode -ne 0) {
              Write-Error "Automated test suite failed with exit code $($toolProcess.ExitCode)"
              # Ensure background engine is killed if it didn't exit
              Stop-Process -Id $engineProcess.Id -Force -ErrorAction SilentlyContinue
              exit 1
          } else {
              Write-Host "========================================="
              Write-Host "All automated integration tests PASSED!"
              Write-Host "========================================="
          }